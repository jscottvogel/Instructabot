name: 📖 Deploy Interactive Robotics Web Textbook

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-textbook:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Documentation Generator Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mkdocs-material

      - name: 📚 Synchronize Documentation Structure
        run: |
          python agent/builder/sync_docs.py

      - name: 🚀 Deploy Web Textbook to GitHub Pages
        run: |
          mkdocs gh-deploy --force
